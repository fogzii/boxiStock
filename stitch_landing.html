<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#9180a8",
              "background-light": "#f7f7f7",
              "background-dark": "#19171b",
              "neutral-dark": "#19171b",
              "border-dark": "#2d2a30",
            },
            fontFamily: {
              display: ["Manrope", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      body {
        font-family: "Manrope", sans-serif;
      }
      .glow-subtle {
        box-shadow: 0 0 20px -5px rgba(145, 128, 168, 0.2);
      }
      .glow-primary {
        box-shadow: 0 10px 40px -10px rgba(145, 128, 168, 0.4);
      }
    </style>
  </head>
  <body
    class="bg-background-dark text-slate-100 antialiased overflow-hidden h-screen flex flex-col"
  >
    <header
      class="fixed top-0 w-full z-50 border-b border-border-dark/50 bg-background-dark/80 backdrop-blur-md"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between"
      >
        <div class="flex items-center gap-2 group cursor-pointer">
          <div class="bg-primary p-1.5 rounded-lg">
            <span
              class="material-symbols-outlined text-background-dark font-bold"
              >inventory_2</span
            >
          </div>
          <h2 class="text-white text-xl font-extrabold tracking-tight">
            BoxiStock
          </h2>
        </div>
        <div class="flex items-center gap-6">
          <button
            class="text-slate-400 hover:text-white font-semibold text-sm transition-colors"
          >
            Log in
          </button>
        </div>
      </div>
    </header>
    <main
      class="flex-grow flex flex-col items-center justify-center relative px-6"
    >
      <div class="absolute inset-0 pointer-events-none overflow-hidden -z-10">
        <div
          class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px]"
        ></div>
      </div>
      <div class="max-w-4xl w-full text-center space-y-12">
        <div class="space-y-4">
          <h1
            class="text-6xl md:text-8xl font-extrabold text-white leading-[1] tracking-tighter"
          >
            Scale Faster. <br />
            <span class="text-primary">Track Less.</span>
          </h1>
        </div>
        <div class="flex flex-col items-center gap-6">
          <p
            class="text-primary font-bold tracking-widest uppercase text-sm md:text-base"
          >
            Automated FIFO for high-volume resellers
          </p>
          <button
            class="group relative bg-primary hover:bg-primary/90 text-white px-12 py-6 rounded-2xl font-black text-2xl md:text-3xl transition-all glow-primary hover:scale-105 active:scale-95 flex items-center gap-4"
          >
            Get Started Now
            <span class="material-symbols-outlined font-bold text-3xl"
              >arrow_forward</span
            >
          </button>
          <p class="text-slate-500 text-sm font-medium">
            Setup in 2 minutes • No credit card required
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
